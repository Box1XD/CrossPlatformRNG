name: CI

# 触发时机：推送到主分支、针对主分支的 PR、以及在 Actions 页面手动运行
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 同一分支上的新提交会取消上一次未完成的运行，节省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION: RandomNumberAvalonia.sln

jobs:
  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props
            **/*.csproj

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props
            **/*.csproj

      - name: Test Core
        run: >
          dotnet test RandomNumberAvalonia.Core.UnitTests -c Release
          --logger "trx;LogFileName=core-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Test ViewModels
        run: >
          dotnet test RandomNumberAvalonia.UnitTests -c Release
          --logger "trx;LogFileName=vm-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        # 即使测试失败也要上传，方便排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 7
